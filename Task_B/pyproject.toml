[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scogo-cli-harness"
version = "0.1.0"
description = "A minimal, policy-constrained repository-repair CLI harness"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

